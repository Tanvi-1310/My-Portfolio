{% extends "base.html" %}

{% block title %}404 - Page Not Found | {{ profile.name }}{% endblock %}

{% block content %}
<section class="section placeholder-section">
    <div class="container placeholder-container">
        <div class="placeholder-card">
            <span class="error-number">404</span>
            <h1 class="placeholder-title">Page Not Found</h1>
            <p class="placeholder-desc">
                The resource or section you are looking for does not exist or has been relocated.
            </p>
            <div class="placeholder-actions">
                <a href="{{ url_for('home') }}" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Return to Home</span>
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
