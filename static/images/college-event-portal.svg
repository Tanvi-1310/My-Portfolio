<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Campus Emerald & Sky Gradient -->
    <linearGradient id="cep-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#e6f7ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cep-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="cep-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f766e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Campus Canvas Background -->
  <rect width="640" height="360" fill="url(#cep-bg)"/>

  <!-- Left Card: Campus Event Directory / Registration Card -->
  <g transform="translate(48, 28)" filter="url(#cep-shadow)">
    <rect width="320" height="304" rx="12" fill="#ffffff" stroke="#cce9df" stroke-width="1.5"/>

    <!-- Event Banner -->
    <rect x="0" y="0" width="320" height="84" rx="12" fill="#0f766e"/>
    <!-- Diagonal Pattern on Header -->
    <g opacity="0.15">
      <line x1="0" y1="0" x2="320" y2="84" stroke="#ffffff" stroke-width="2"/>
      <line x1="40" y1="0" x2="360" y2="84" stroke="#ffffff" stroke-width="2"/>
      <line x1="-40" y1="0" x2="280" y2="84" stroke="#ffffff" stroke-width="2"/>
    </g>

    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="84" height="18" rx="9" fill="rgba(255,255,255,0.2)"/>
      <text x="42" y="12" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">TECH SUMMIT '26</text>
      
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Campus Event Portal</text>
      <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#ccfbf1">Annual Student Technology &amp; Innovation Fest</text>
    </g>

    <!-- Registration Details Grid -->
    <g transform="translate(20, 102)">
      <!-- Item 1: Event Schedule -->
      <g transform="translate(0, 0)">
        <rect width="132" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#64748b">DATE &amp; TIME</text>
        <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Oct 24, 2026</text>
        <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#0d9488">10:00 AM - 5:30 PM</text>
      </g>

      <!-- Item 2: Venue -->
      <g transform="translate(148, 0)">
        <rect width="132" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#64748b">CAMPUS VENUE</text>
        <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Main Auditorium</text>
        <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#0d9488">Hall C • Tech Wing</text>
      </g>

      <!-- Item 3: Capacity & Registration Status -->
      <g transform="translate(0, 62)">
        <rect width="280" height="56" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#14532d">Student Registrations Open</text>
        <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#166534">520 / 600 Students Registered</text>
        
        <!-- Progress Bar -->
        <rect x="14" y="42" width="252" height="5" rx="2.5" fill="#dcfce7"/>
        <rect x="14" y="42" width="218" height="5" rx="2.5" fill="#16a34a"/>
      </g>

      <!-- Category Tags -->
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="80" height="20" rx="10" fill="#f1f5f9"/>
        <text x="40" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">Coding Sprint</text>

        <rect x="88" y="0" width="84" height="20" rx="10" fill="#f1f5f9"/>
        <text x="130" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">AI Workshop</text>

        <rect x="180" y="0" width="100" height="20" rx="10" fill="#f1f5f9"/>
        <text x="230" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">Project Showcase</text>
      </g>
    </g>
  </g>

  <!-- Right Card: Digital Attendee Event Pass (QR Ticket) -->
  <g transform="translate(390, 28)" filter="url(#cep-shadow)">
    <rect width="202" height="304" rx="10" fill="#ffffff" stroke="#cce9df" stroke-width="1.5"/>

    <!-- Pass Header Pill -->
    <rect x="0" y="0" width="202" height="42" rx="10" fill="url(#cep-badge-grad)"/>
    <text x="101" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">OFFICIAL PARTICIPANT PASS</text>

    <!-- Attendee Badge Info -->
    <g transform="translate(18, 56)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Priya Sharma</text>
      <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#0284c7">ROLL: IT-2024-412 • SE-IT</text>
      
      <!-- Verified Badge -->
      <g transform="translate(0, 32)">
        <rect width="92" height="18" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <circle cx="10" cy="9" r="3.5" fill="#10b981"/>
        <text x="50" y="12.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">✓ Verified Entry</text>
      </g>
    </g>

    <!-- QR Code Graphic Mockup -->
    <g transform="translate(43, 120)">
      <rect width="116" height="116" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      
      <!-- QR Pattern Geometry -->
      <!-- Top Left Position Square -->
      <rect x="12" y="12" width="24" height="24" rx="2" fill="#0f172a"/>
      <rect x="16" y="16" width="16" height="16" rx="1" fill="#f8fafc"/>
      <rect x="20" y="20" width="8" height="8" rx="1" fill="#0f172a"/>

      <!-- Top Right Position Square -->
      <rect x="80" y="12" width="24" height="24" rx="2" fill="#0f172a"/>
      <rect x="84" y="16" width="16" height="16" rx="1" fill="#f8fafc"/>
      <rect x="88" y="20" width="8" height="8" rx="1" fill="#0f172a"/>

      <!-- Bottom Left Position Square -->
      <rect x="12" y="80" width="24" height="24" rx="2" fill="#0f172a"/>
      <rect x="16" y="84" width="16" height="16" rx="1" fill="#f8fafc"/>
      <rect x="20" y="88" width="8" height="8" rx="1" fill="#0f172a"/>

      <!-- Center Data Modules -->
      <rect x="44" y="16" width="6" height="6" fill="#0f172a"/>
      <rect x="56" y="16" width="12" height="6" fill="#0f172a"/>
      <rect x="44" y="28" width="18" height="6" fill="#0f172a"/>
      <rect x="68" y="28" width="6" height="12" fill="#0f172a"/>
      <rect x="16" y="44" width="12" height="6" fill="#0f172a"/>
      <rect x="36" y="44" width="24" height="6" fill="#0f172a"/>
      <rect x="66" y="44" width="12" height="6" fill="#0f172a"/>
      <rect x="84" y="44" width="18" height="6" fill="#0f172a"/>
      <rect x="24" y="56" width="18" height="6" fill="#0f172a"/>
      <rect x="48" y="56" width="12" height="18" fill="#0f172a"/>
      <rect x="68" y="56" width="18" height="6" fill="#0f172a"/>
      <rect x="44" y="80" width="18" height="6" fill="#0f172a"/>
      <rect x="68" y="80" width="12" height="12" fill="#0f172a"/>
      <rect x="86" y="80" width="16" height="6" fill="#0f172a"/>
      <rect x="44" y="94" width="12" height="12" fill="#0f172a"/>
      <rect x="62" y="94" width="24" height="12" fill="#0f172a"/>
    </g>

    <!-- Pass Code & Barcode -->
    <g transform="translate(18, 252)">
      <text x="83" y="10" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">REG-2026-8812-TC</text>
      
      <!-- Barcode Lines -->
      <g transform="translate(10, 18)" opacity="0.7">
        <line x1="0" y1="0" x2="0" y2="16" stroke="#0f172a" stroke-width="2"/>
        <line x1="6" y1="0" x2="6" y2="16" stroke="#0f172a" stroke-width="1"/>
        <line x1="10" y1="0" x2="10" y2="16" stroke="#0f172a" stroke-width="3"/>
        <line x1="18" y1="0" x2="18" y2="16" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="24" y1="0" x2="24" y2="16" stroke="#0f172a" stroke-width="2"/>
        <line x1="32" y1="0" x2="32" y2="16" stroke="#0f172a" stroke-width="1"/>
        <line x1="38" y1="0" x2="38" y2="16" stroke="#0f172a" stroke-width="2.5"/>
        <line x1="46" y1="0" x2="46" y2="16" stroke="#0f172a" stroke-width="1"/>
        <line x1="54" y1="0" x2="54" y2="16" stroke="#0f172a" stroke-width="3"/>
        <line x1="62" y1="0" x2="62" y2="16" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="70" y1="0" x2="70" y2="16" stroke="#0f172a" stroke-width="2"/>
        <line x1="76" y1="0" x2="76" y2="16" stroke="#0f172a" stroke-width="1"/>
        <line x1="84" y1="0" x2="84" y2="16" stroke="#0f172a" stroke-width="3"/>
        <line x1="94" y1="0" x2="94" y2="16" stroke="#0f172a" stroke-width="1"/>
        <line x1="100" y1="0" x2="100" y2="16" stroke="#0f172a" stroke-width="2.5"/>
        <line x1="108" y1="0" x2="108" y2="16" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="116" y1="0" x2="116" y2="16" stroke="#0f172a" stroke-width="2"/>
        <line x1="124" y1="0" x2="124" y2="16" stroke="#0f172a" stroke-width="1"/>
        <line x1="130" y1="0" x2="130" y2="16" stroke="#0f172a" stroke-width="3"/>
        <line x1="140" y1="0" x2="140" y2="16" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="146" y1="0" x2="146" y2="16" stroke="#0f172a" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
