<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="sr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0fa"/>
      <stop offset="50%" stop-color="#ede4f7"/>
      <stop offset="100%" stop-color="#e2d4f2"/>
    </linearGradient>
    <filter id="sr-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4a3670" flood-opacity="0.12"/>
    </filter>
    <filter id="sr-subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4a3670" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="640" height="360" fill="url(#sr-bg)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.25">
    <line x1="40" y1="0" x2="40" y2="360" stroke="#7353ba" stroke-dasharray="4,6" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="360" stroke="#7353ba" stroke-dasharray="4,6" stroke-width="1"/>
    <line x1="440" y1="0" x2="440" y2="360" stroke="#7353ba" stroke-dasharray="4,6" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="360" stroke="#7353ba" stroke-dasharray="4,6" stroke-width="1"/>
    <line x1="0" y1="60" x2="640" y2="60" stroke="#7353ba" stroke-dasharray="4,6" stroke-width="1"/>
    <line x1="0" y1="180" x2="640" y2="180" stroke="#7353ba" stroke-dasharray="4,6" stroke-width="1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#7353ba" stroke-dasharray="4,6" stroke-width="1"/>
  </g>

  <!-- Main Resume Document Card -->
  <g transform="translate(64, 30)" filter="url(#sr-shadow)">
    <!-- Paper Sheet -->
    <rect width="320" height="300" rx="10" fill="#ffffff" stroke="#e6ddf2" stroke-width="1.5"/>
    
    <!-- Top Decorative Line -->
    <rect x="0" y="0" width="320" height="5" rx="2.5" fill="#7353ba"/>

    <!-- Document Header: Profile & Name -->
    <g transform="translate(24, 24)">
      <circle cx="18" cy="18" r="16" fill="#f0ebf8" stroke="#7353ba" stroke-width="1.5"/>
      <path d="M12 24 C12 20 15 19 18 19 C21 19 24 20 24 24" fill="none" stroke="#7353ba" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="18" cy="13" r="4.5" fill="none" stroke="#7353ba" stroke-width="1.8"/>

      <text x="44" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#221e2e">Candidate Resume</text>
      <text x="44" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#7353ba">Software Engineering Student</text>
    </g>

    <!-- Section: Experience -->
    <g transform="translate(24, 78)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4a3b68" letter-spacing="0.5">TECHNICAL EXPERIENCE</text>
      <line x1="0" y1="16" x2="272" y2="16" stroke="#ede5f7" stroke-width="1.5"/>

      <!-- Role 1 -->
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#221e2e">Frontend Developer Intern</text>
      
      <!-- Bullet 1 with entity tag -->
      <circle cx="4" cy="46" r="2.5" fill="#7353ba"/>
      <rect x="14" y="43" width="190" height="6" rx="3" fill="#8f89a0"/>
      <rect x="14" y="53" width="160" height="6" rx="3" fill="#aba5bb"/>

      <!-- Bullet 2 (NLP highlighted block) -->
      <circle cx="4" cy="71" r="2.5" fill="#7353ba"/>
      <rect x="14" y="68" width="220" height="6" rx="3" fill="#7353ba" opacity="0.75"/>
      <rect x="14" y="78" width="150" height="6" rx="3" fill="#aba5bb"/>
    </g>

    <!-- Section: Skills Chips -->
    <g transform="translate(24, 180)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4a3b68" letter-spacing="0.5">TECHNICAL SKILLS</text>
      <line x1="0" y1="16" x2="272" y2="16" stroke="#ede5f7" stroke-width="1.5"/>

      <!-- Chips -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="56" height="18" rx="9" fill="#f0e9f8" stroke="#d5c7ea" stroke-width="1"/>
        <text x="28" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#7353ba" text-anchor="middle">React.js</text>

        <rect x="62" y="0" width="54" height="18" rx="9" fill="#f0e9f8" stroke="#d5c7ea" stroke-width="1"/>
        <text x="89" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#7353ba" text-anchor="middle">Python</text>

        <rect x="122" y="0" width="50" height="18" rx="9" fill="#f0e9f8" stroke="#d5c7ea" stroke-width="1"/>
        <text x="147" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#7353ba" text-anchor="middle">Flask</text>

        <rect x="178" y="0" width="54" height="18" rx="9" fill="#f0e9f8" stroke="#d5c7ea" stroke-width="1"/>
        <text x="205" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#7353ba" text-anchor="middle">FastAPI</text>
      </g>
    </g>

    <!-- Section: Education -->
    <g transform="translate(24, 244)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4a3b68" letter-spacing="0.5">EDUCATION</text>
      <line x1="0" y1="16" x2="272" y2="16" stroke="#ede5f7" stroke-width="1.5"/>
      <rect x="0" y="24" width="180" height="6" rx="3" fill="#8f89a0"/>
    </g>
  </g>

  <!-- Right Panel: Illustrative AI Entity Parser -->
  <g transform="translate(406, 38)" filter="url(#sr-subtle-shadow)">
    <rect width="180" height="284" rx="12" fill="#ffffff" stroke="#d8cbe8" stroke-width="1.5"/>

    <!-- Parser Header -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="148" height="34" rx="6" fill="#fbf9fe" stroke="#ede5f7" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#7353ba"/>
      <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#4a3670">AI Resume Parser</text>
      <text x="28" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#867f99">NLP Section Extraction</text>
    </g>

    <!-- Extracted Taxonomy Modules -->
    <g transform="translate(16, 62)">
      <!-- Module 1: Keywords -->
      <g transform="translate(0, 0)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#3b2d56">KEYWORD MATCHING</text>
        <g transform="translate(0, 16)">
          <rect x="0" y="0" width="70" height="18" rx="4" fill="#f4effa" stroke="#d8cbe8" stroke-width="1"/>
          <text x="35" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#5e439b" text-anchor="middle">UI Components</text>

          <rect x="76" y="0" width="68" height="18" rx="4" fill="#f4effa" stroke="#d8cbe8" stroke-width="1"/>
          <text x="110" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#5e439b" text-anchor="middle">REST APIs</text>
        </g>
      </g>

      <!-- Module 2: Section Breakdown -->
      <g transform="translate(0, 48)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#3b2d56">STRUCTURE MAPPING</text>
        <g transform="translate(0, 16)">
          <rect x="0" y="0" width="148" height="20" rx="4" fill="#faf7fd" stroke="#ede5f7" stroke-width="1"/>
          <circle cx="10" cy="10" r="3" fill="#10b981"/>
          <text x="20" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#3b2d56">Experience Hierarchy</text>

          <rect x="0" y="24" width="148" height="20" rx="4" fill="#faf7fd" stroke="#ede5f7" stroke-width="1"/>
          <circle cx="10" cy="10" r="3" fill="#10b981"/>
          <text x="20" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#3b2d56">Skills Taxonomy</text>

          <rect x="0" y="48" width="148" height="20" rx="4" fill="#faf7fd" stroke="#ede5f7" stroke-width="1"/>
          <circle cx="10" cy="10" r="3" fill="#10b981"/>
          <text x="20" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#3b2d56">Contact Information</text>
        </g>
      </g>

      <!-- Module 3: Feedback Note -->
      <g transform="translate(0, 142)">
        <rect width="148" height="46" rx="6" fill="#f5f0fa" stroke="#e0d4f0" stroke-width="1"/>
        <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#4a3670">Analysis Feedback</text>
        <text x="10" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#665e77">Bullet formatting structured.</text>
        <text x="10" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#665e77">Technical stack recognized.</text>
      </g>
    </g>
  </g>
</svg>
