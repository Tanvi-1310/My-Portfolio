<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="po-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0e1e38"/>
    </linearGradient>
    <linearGradient id="po-ice-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="po-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="po-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Arctic Canvas Background -->
  <rect width="640" height="360" fill="url(#po-bg)"/>

  <!-- Subtle Polar Coordinate Grid -->
  <g transform="translate(210, 180)" opacity="0.35">
    <circle r="45" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,3"/>
    <circle r="95" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,3"/>
    <circle r="145" fill="none" stroke="#38bdf8" stroke-width="1"/>
    
    <line x1="-165" y1="0" x2="165" y2="0" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2,4"/>
    <line x1="0" y1="-165" x2="0" y2="165" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2,4"/>

    <text x="0" y="-150" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7dd3fc" text-anchor="middle">75°S</text>
    <text x="0" y="-100" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7dd3fc" text-anchor="middle">85°S</text>
  </g>

  <!-- Antarctic Stylized Coastline & Spatial Model -->
  <g transform="translate(210, 180)">
    <path d="M -125,-30 
             C -135,-75 -85,-125 -25,-120 
             C 25,-115 85,-95 115,-55 
             C 145,-15 140,45 105,80 
             C 70,115 5,130 -45,110 
             C -95,90 -115,10 -125,-30 Z" 
          fill="url(#po-ice-fill)" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Expedition Traversal Path -->
    <path d="M 45,15 Q 10,-20 -5,-5 T -75,-55" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="4,4"/>

    <!-- Station Waypoint: McMurdo Station -->
    <g transform="translate(45, 15)">
      <circle r="5" fill="#f43f5e"/>
      <circle r="10" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.5"/>
      <rect x="14" y="-10" width="88" height="18" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1" opacity="0.95"/>
      <text x="18" y="2" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#fecdd3">McMurdo Base</text>
    </g>

    <!-- Station Waypoint: South Pole Amundsen-Scott -->
    <g transform="translate(-5, -5)">
      <circle r="4" fill="#38bdf8"/>
      <rect x="-85" y="-16" width="76" height="16" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.75" opacity="0.9"/>
      <text x="-80" y="-5" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#bae6fd">Amundsen-Scott</text>
    </g>

    <!-- Coastal Research Outpost -->
    <g transform="translate(-75, -55)">
      <circle r="3.5" fill="#34d399"/>
      <text x="-10" y="-8" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a7f3d0" text-anchor="end">Palmer Station</text>
    </g>
  </g>

  <!-- Right Panel: Operational Twin Concept Interface -->
  <g transform="translate(415, 32)" filter="url(#po-shadow)">
    <rect width="195" height="296" rx="10" fill="url(#po-card-grad)" stroke="#334155" stroke-width="1.5"/>

    <!-- HUD Header -->
    <g transform="translate(14, 14)">
      <rect width="167" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="17" r="4" fill="#38bdf8"/>
      <text x="26" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#f1f5f9">DIGITAL TWIN INTERFACE</text>
      <text x="26" y="26" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#38bdf8">Antarctic Operations Model</text>
    </g>

    <!-- Layer Control Items (Honest architectural components) -->
    <g transform="translate(14, 58)">
      <!-- Layer 1 -->
      <rect width="167" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="21" r="3" fill="#34d399"/>
      <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#e2e8f0">Terrain &amp; Elevation Mesh</text>
      <text x="26" y="29" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#94a3b8">Active Surface Layer</text>

      <!-- Layer 2 -->
      <g transform="translate(0, 48)">
        <rect width="167" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="21" r="3" fill="#38bdf8"/>
        <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#e2e8f0">Station Asset Network</text>
        <text x="26" y="29" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#94a3b8">3 Connected Research Bases</text>
      </g>

      <!-- Layer 3 -->
      <g transform="translate(0, 96)">
        <rect width="167" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="21" r="3" fill="#f43f5e"/>
        <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#e2e8f0">Field Traversal Corridors</text>
        <text x="26" y="29" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#94a3b8">Overland Route Planning</text>
      </g>

      <!-- Status Module -->
      <g transform="translate(0, 144)">
        <rect width="167" height="46" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#64748b">SYSTEM ARCHITECTURE</text>
        <text x="12" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#e2e8f0">FastAPI + PostgreSQL + React</text>
        <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="7" fill="#38bdf8">Spatial GIS Integration</text>
      </g>
    </g>
  </g>

  <!-- Top-Left Branding Badge -->
  <g transform="translate(28, 28)">
    <rect width="154" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.95"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
    <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#e2e8f0">POLAROPS • AODT</text>
  </g>
</svg>
