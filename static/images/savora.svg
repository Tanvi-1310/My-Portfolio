<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Warm Bistro Gradient Background -->
    <linearGradient id="sv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="50%" stop-color="#feede0"/>
      <stop offset="100%" stop-color="#fcdbc9"/>
    </linearGradient>
    <linearGradient id="sv-ticket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfcfb"/>
    </linearGradient>
    <filter id="sv-card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7c2d12" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Warm Canvas Background -->
  <rect width="640" height="360" fill="url(#sv-bg)"/>

  <!-- Left Panel: Restaurant Floor Plan Map -->
  <g transform="translate(48, 28)" filter="url(#sv-card-shadow)">
    <!-- Floor Surface -->
    <rect width="320" height="304" rx="12" fill="#ffffff" stroke="#f3d7c6" stroke-width="1.5"/>

    <!-- Floor Plan Header -->
    <g transform="translate(20, 20)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#2d1b12">Dining Floor Grid</text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9a6c55">Table Allocation &amp; Service Zones</text>

      <rect x="204" y="2" width="76" height="22" rx="11" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <circle cx="216" cy="13" r="3.5" fill="#ef4444"/>
      <text x="248" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">Live Service</text>
    </g>

    <line x1="20" y1="58" x2="300" y2="58" stroke="#fce7db" stroke-width="1"/>

    <!-- Floor Plan Grid: Tables -->
    <g transform="translate(24, 76)">
      <!-- Table T-01: 4 Top (Occupied) -->
      <g transform="translate(0, 0)">
        <rect width="76" height="54" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
        <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">T-01</text>
        <rect x="16" y="32" width="44" height="14" rx="7" fill="#fee2e2"/>
        <text x="38" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Occupied</text>
      </g>

      <!-- Table T-02: 4 Top (Ready / Dining) -->
      <g transform="translate(96, 0)">
        <rect width="76" height="54" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">T-02</text>
        <rect x="16" y="32" width="44" height="14" rx="7" fill="#dcfce7"/>
        <text x="38" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#15803d" text-anchor="middle">Ordered</text>
      </g>

      <!-- Table T-03: 2 Top (Available) -->
      <g transform="translate(192, 0)">
        <rect width="64" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">T-03</text>
        <rect x="10" y="32" width="44" height="14" rx="7" fill="#f1f5f9"/>
        <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">Available</text>
      </g>

      <!-- Table T-04: Round Booth (Reserved) -->
      <g transform="translate(0, 74)">
        <circle cx="38" cy="30" r="28" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
        <text x="38" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">T-04</text>
        <rect x="16" y="34" width="44" height="14" rx="7" fill="#fef3c7"/>
        <text x="38" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b45309" text-anchor="middle">Reserved</text>
      </g>

      <!-- Table T-05: 6 Top (Occupied) -->
      <g transform="translate(96, 74)">
        <rect width="112" height="54" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
        <text x="56" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">T-05 • 6 Seater</text>
        <rect x="34" y="32" width="44" height="14" rx="7" fill="#fee2e2"/>
        <text x="56" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Course 2</text>
      </g>
    </g>

    <!-- Floor Legend -->
    <g transform="translate(24, 252)">
      <circle cx="6" cy="6" r="4" fill="#ef4444"/>
      <text x="16" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#78350f">Occupied</text>

      <circle cx="76" cy="6" r="4" fill="#22c55e"/>
      <text x="86" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#78350f">Serving</text>

      <circle cx="138" cy="6" r="4" fill="#f59e0b"/>
      <text x="148" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#78350f">Reserved</text>
    </g>
  </g>

  <!-- Right Panel: Kitchen Ticket & Order Flow (KOT) -->
  <g transform="translate(390, 28)" filter="url(#sv-card-shadow)">
    <!-- Ticket Card -->
    <rect width="202" height="304" rx="10" fill="url(#sv-ticket-grad)" stroke="#fbd0b7" stroke-width="1.5"/>

    <!-- Perforation Dots at Top -->
    <g transform="translate(14, 8)" opacity="0.4">
      <circle cx="10" cy="0" r="2.5" fill="#ea580c"/>
      <circle cx="28" cy="0" r="2.5" fill="#ea580c"/>
      <circle cx="46" cy="0" r="2.5" fill="#ea580c"/>
      <circle cx="64" cy="0" r="2.5" fill="#ea580c"/>
      <circle cx="82" cy="0" r="2.5" fill="#ea580c"/>
      <circle cx="100" cy="0" r="2.5" fill="#ea580c"/>
      <circle cx="118" cy="0" r="2.5" fill="#ea580c"/>
      <circle cx="136" cy="0" r="2.5" fill="#ea580c"/>
      <circle cx="154" cy="0" r="2.5" fill="#ea580c"/>
      <circle cx="172" cy="0" r="2.5" fill="#ea580c"/>
    </g>

    <!-- Ticket Header -->
    <g transform="translate(18, 22)">
      <rect x="0" y="0" width="166" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#9a3412">KITCHEN TICKET #108</text>
      <text x="10" y="30" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c2410c">Table 02 • Station: Grill</text>
      
      <!-- Time Pill -->
      <rect x="116" y="8" width="42" height="18" rx="4" fill="#ffedd5"/>
      <text x="137" y="20.5" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#9a3412" text-anchor="middle">19:42</text>
    </g>

    <!-- Ordered Items -->
    <g transform="translate(18, 76)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1c1917">2× Truffle Tagliatelle</text>
        <text x="166" y="12" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#059669" text-anchor="end">Done</text>
        <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#78716c">+ Extra aged parmesan</text>
      </g>
      <line x1="0" y1="32" x2="166" y2="32" stroke="#f3ebe6" stroke-width="1"/>

      <!-- Item 2 -->
      <g transform="translate(0, 40)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1c1917">1× Burrata Caprese</text>
        <text x="166" y="12" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ea580c" text-anchor="end">Prep</text>
        <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#78716c">Heirloom tomatoes, balsamic</text>
      </g>
      <line x1="0" y1="32" x2="166" y2="32" stroke="#f3ebe6" stroke-width="1"/>

      <!-- Item 3 -->
      <g transform="translate(0, 80)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#1c1917">2× Artisanal Mocktail</text>
        <text x="166" y="12" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#059669" text-anchor="end">Done</text>
        <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#78716c">Rosemary &amp; Grapefruit spritz</text>
      </g>
    </g>

    <!-- Live Status Banner -->
    <g transform="translate(18, 204)">
      <rect width="166" height="42" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
      <circle cx="16" cy="21" r="5" fill="#f59e0b"/>
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#92400e">Kitchen Queue</text>
      <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#b45309">Plating course in progress</text>
    </g>

    <!-- Action Button -->
    <g transform="translate(18, 258)">
      <rect width="166" height="30" rx="6" fill="#ea580c"/>
      <text x="83" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Ready for Service ✓</text>
    </g>
  </g>
</svg>
